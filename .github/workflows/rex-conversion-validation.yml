name: Rex conversion validation
on:
  pull_request:
    paths:
      - 'src/components/sdr/ServiceLanding.jsx'
      - 'src/components/sdr/InstantQuoteFlow.jsx'
      - '.github/workflows/rex-conversion-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
