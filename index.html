        <h2 style="color:#187B65">Same Day Recycling &mdash; Nationwide Junk Removal &amp; Recycling Network</h2>
        <p>Same Day Recycling connects customers across Canada with junk removal, furniture and appliance pickup, electronics recycling and metal pickup, fulfilled through a network of verified local contractors. Request service in any Canadian city; contractor acceptance, your upfront price and arrival window are confirmed before anything is scheduled or charged.</p>
        <h3>Contact us</h3>
        <ul>
          <li>Phone or text: <a href="tel:+16048491745">(604) 849-1745</a></li>
          <li>Email: <a href="mailto:samedayrecycling@gmail.com">samedayrecycling@gmail.com</a></li>
          <li>Hours: open 24 hours &mdash; requests accepted any time</li>
          <li>Service area: every Canadian city (contractor availability confirmed per job)</li>
        </ul>
        <h3>What junk removal costs</h3>
        <p>You pay for the truck space your load fills, in Canadian dollars: minimum pickup from $139, 1/8 truck from $189, 1/4 truck from $269, 1/2 truck from $419, 3/4 truck from $549, full truck from $649. The final price is approved by you before we lift a thing. Full details: <a href="https://samedayrecycling.ca/pricing">samedayrecycling.ca/pricing</a></p>
        <h3>Services</h3>
        <ul>
          <li><a href="https://samedayrecycling.ca/furniture-removal">Furniture removal</a> &mdash; couches, mattresses, dressers; donated first where possible</li>
          <li><a href="https://samedayrecycling.ca/appliance-removal">Appliance removal</a> &mdash; fridges, stoves, washers, dryers</li>
          <li><a href="https://samedayrecycling.ca/electronics-recycling">Electronics recycling</a> &mdash; TVs, computers, e-waste handled properly</li>
          <li><a href="https://samedayrecycling.ca/free-metal-pickup">Free metal pickup</a> &mdash; scrap metal hauled at no charge</li>
          <li><a href="https://samedayrecycling.ca/commercial-recycling">Commercial recycling</a> &mdash; offices, strata and property managers</li>
        </ul>
        <p>Every load is sorted &mdash; recycled, donated or responsibly disposed &mdash; and recycling receipts are available for every job. Request a pickup at <a href="https://samedayrecycling.ca/request-service">samedayrecycling.ca/request-service</a>.</p>
